<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Edge of Time - Race Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/selection.css">
    <link rel="stylesheet" href="styles/mobile-menu.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <header>
        <h1>Lost Edge of Time - Race Selection</h1>
    </header>

    <button class="mobile-menu-btn">Меню</button>
    <div class="mobile-menu-container">
        <div class="mobile-menu-header">
            <h2>Меню</h2>
            <button class="mobile-menu-close">✕</button>
        </div>
        <div class="mobile-menu-tabs">
            <a href="index.html" class="mobile-menu-tab">Origin</a>
            <a href="race.html" class="mobile-menu-tab active">Race</a>
            <a href="traits.html" class="mobile-menu-tab">Traits</a>
            <a href="powersets.html" class="mobile-menu-tab">Power Sets</a>
            <a href="character.html" class="mobile-menu-tab">Character</a>
        </div>
    </div>

    <div class="tab-container">
        <a href="index.html" class="tab">Origin</a>
        <a href="race.html" class="tab active">Race</a>
        <a href="traits.html" class="tab">Traits</a>
        <a href="powersets.html" class="tab">Power Sets</a>
        <a href="character.html" class="tab">Character</a>
    </div>

    <div class="main-container">
        <div id="race-grid" class="selection-grid"></div>

        <div id="selected-view" class="selected-view" style="display: none;">
            <div class="selected-card-container">
                <div id="selected-card" class="selected-card"></div>
            </div>
            <div class="description-container">
                <h2 id="race-title">Выберите расу</h2>
                <div id="race-description" class="selection-description"></div>
            </div>
            <div id="scroll-container" class="scroll-container"></div>
        </div>
    </div>

    <button id="reset-button" class="reset-button" style="display: none;">Вернуться</button>

    <script type="module" src="scripts/race.js"></script>
    <script src="scripts/particles.js" defer></script>
    <script src="scripts/mobile-menu.js" defer></script>
</body>
</html>
