<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Edge of Time - Race Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/selection.css">
    <link rel="stylesheet" href="styles/mobile-menu.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <header>
        <h1>Lost Edge of Time - Race Selection</h1>
    </header>
    
    <!-- Навигация -->
    <div class="tab-container">
        <a href="index.html" class="tab">Origin</a>
        <a href="race.html" class="tab active">Race</a>
        <a href="traits.html" class="tab">Traits</a>
        <a href="powersets.html" class="tab">Power Sets</a>
        <a href="character.html" class="tab">Character</a>
    </div>
    
    <!-- Основной контент -->
    <div class="main-container">
        <div id="race-grid" class="selection-grid"></div>
        
        <div id="selected-view" class="selected-view" style="display: none;">
            <!-- Большое изображение слева -->
            <div id="selected-card" class="selected-card"></div>
            
            <!-- Описание справа -->
            <div class="description-container">
                <h2 id="race-title">Выберите расу</h2>
                <div id="race-description" class="selection-description"></div>
            </div>
            
            <!-- Скролл внизу -->
            <div id="scroll-container" class="scroll-container"></div>
        </div>
    </div>
    
    <button id="reset-button" class="reset-button" style="display: none;">Вернуться</button>

    <script type="module">
        import { SelectionManager } from './scripts/selection.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const manager = new SelectionManager({
                    gridSelector: '#race-grid',
                    selectedViewSelector: '#selected-view',
                    selectedCardSelector: '#selected-card',
                    titleSelector: '#race-title',
                    descriptionSelector: '#race-description',
                    scrollContainerSelector: '#scroll-container',
                    resetButtonSelector: '#reset-button',
                    apiEndpoint: 'races.json',
                    imageFolder: 'races',
                    pageUrl: 'race.html',
                    cardClass: 'race-card'
                });
                manager.init();
            } catch (error) {
                console.error('Initialization error:', error);
            }
        });
    </script>
</body>
</html>
