<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Edge of Time - Race Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/selection.css">
    <link rel="stylesheet" href="styles/mobile-menu.css">
</head>
<body>
    <!-- Шапка (возвращаем на место) -->
    <canvas id="particle-canvas"></canvas>
    <header>
        <h1>Lost Edge of Time - Race Selection</h1>
    </header>

    <!-- Контент -->
    <div class="main-container">
        <!-- Сетка выбора -->
        <div id="race-grid" class="race-grid"></div>

        <!-- Выбранная раса -->
        <div id="selected-view" class="selected-view" style="display: none;">
            <!-- Блоки теперь в правильном порядке -->
            <div class="selected-card-container">
                <div id="selected-card" class="selected-card"></div>
            </div>
            <div class="description-container">
                <h2 id="race-title">Выберите расу</h2>
                <div id="race-description" class="selection-description"></div>
            </div>
            <div id="scroll-container" class="scroll-container"></div>
        </div>
    </div>

    <button id="reset-button" class="reset-button">Вернуться</button>

    <script type="module" src="scripts/race.js"></script>
    <script src="scripts/particles.js" defer></script>
    <script src="scripts/mobile-menu.js" defer></script>
</body>
</html>
