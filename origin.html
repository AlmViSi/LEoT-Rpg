<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Edge of Time - Origin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/selection.css">
    <link rel="stylesheet" href="styles/mobile-menu.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <header>
        <h1>Lost Edge of Time - Origin</h1>
    </header>

    <div class="main-container">
        <!-- Сетка выбора -->
        <div id="origin-grid" class="selection-grid"></div>

        <!-- Выбранный элемент -->
        <div id="selected-view" class="selected-view" style="display: none;">
            <!-- Левая колонка: изображение -->
            <div id="selected-card" class="selected-card"></div>

            <!-- Правая колонка: описание -->
            <div class="description-container">
                <h2 id="origin-title">Выберите Origin</h2>
                <div id="origin-description" class="selection-description"></div>
            </div>

            <!-- Скролл (на всю ширину) -->
            <div id="scroll-container" class="scroll-container"></div>
        </div>
    </div>

    <button id="reset-button" class="reset-button" style="display: none;">Вернуться</button>

    <script type="module">
        import { SelectionManager } from './scripts/selection.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            new SelectionManager({
                gridSelector: '#origin-grid',
                selectedViewSelector: '#selected-view',
                selectedCardSelector: '#selected-card',
                titleSelector: '#origin-title',
                descriptionSelector: '#origin-description',
                scrollContainerSelector: '#scroll-container',
                resetButtonSelector: '#reset-button',
                apiEndpoint: 'origins.json',
                imageFolder: 'origins',
                pageUrl: 'origin.html',
                cardClass: 'origin-card'
            }).init();
        });
    </script>
</body>
</html>
